<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Random OC Gacha 🌸</title>

<style>

body {
    margin: 0;
    min-height: 100vh;

    background-image: url("background2.jpg");
    background-repeat: repeat;
    background-size: 250px auto;
    background-position: top center;
    background-attachment: fixed;

    font-family: "Trebuchet MS", Arial, sans-serif;
    text-align: center;
}


/* Title box */

.titleBox {

    display:inline-block;

    margin-top:40px;

    padding:15px 35px;

    background:rgba(255,255,255,0.8);

    border-radius:25px;

    box-shadow:
    0 6px 20px rgba(0,0,0,.12);

}


h1 {

    margin:0;

    color:#c75d95;

    text-shadow:
    2px 2px white;

    font-size:42px;

}



/* New OC text */

#newOC {

    font-size:28px;

    color:#d66aa5;

    text-shadow:
    2px 2px white;

    opacity:0;

    margin-top:20px;

}


.showNew {

    animation:
    popText .8s ease forwards;

}



@keyframes popText {

    0% {

        opacity:0;

        transform:scale(.5);

    }


    50% {

        opacity:1;

        transform:scale(1.2);

    }


    100% {

        opacity:1;

        transform:scale(1);

    }

}



/* OC card */

#card {

    display:inline-block;

    margin-top:20px;

    padding:18px;

    background:rgba(255,255,255,0.75);

    border-radius:22px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.18);

}



#ocImage {

    max-width:80vw;

    max-height:600px;

    border-radius:14px;

    opacity:0;

    transition:
    opacity .4s ease;

}



/* Button box */

.buttonBox {

    display:inline-block;

    margin-top:25px;

    padding:15px 25px;

    background:rgba(255,255,255,0.8);

    border-radius:25px;

    box-shadow:
    0 6px 20px rgba(0,0,0,.12);

}



#buttonImage {

    width:220px;

    cursor:pointer;

    transition:.2s;

}



#buttonImage:hover {

    filter:
    drop-shadow(0 0 15px #ffd1ea);

}



#buttonImage:active {

    transform:scale(.95);

    filter:
    drop-shadow(0 0 20px #fff2a8);

}



/* Sparkles */

.sparkle {

    position:fixed;

    font-size:25px;

    pointer-events:none;

    animation:
    sparkle 900ms forwards;

}



@keyframes sparkle {


    from {

        opacity:1;

        transform:
        translateY(0)
        scale(.5);

    }


    to {

        opacity:0;

        transform:
        translateY(-80px)
        scale(1.5);

    }

}


</style>

</head>


<body>


<div class="titleBox">

<h1>🌸 Random OC Picker 🌸</h1>

</div>



<div id="newOC">
✨ New OC! ✨
</div>



<div id="card">

<img id="ocImage" alt="Random OC">

</div>



<br>



<div class="buttonBox">

<img
id="buttonImage"
src="https://raw.githubusercontent.com/Peachiepeeps/oc-images/main/button.png"
onclick="pickOC()"
alt="Pick Another">

</div>



<script>


let images = [];



fetch("https://api.github.com/repos/Peachiepeeps/oc-images/contents?ref=main")

.then(response => response.json())

.then(files => {


    images = files

    .filter(file =>
        file.name.match(/\.(png|jpg|jpeg|webp)$/i)
    )

    .filter(file =>
        file.name !== "button.png"
    )

    .map(file =>
        file.name
    );


    pickOC();


});





function createSparkles(){


    for(let i=0;i<15;i++){


        let sparkle =
        document.createElement("div");


        sparkle.className="sparkle";


        sparkle.innerHTML="✨";


        sparkle.style.left =
        (
            window.innerWidth/2
            +
            (Math.random()*250-125)
        )
        +"px";


        sparkle.style.top =
        (
            window.innerHeight/2
            +
            (Math.random()*200-100)
        )
        +"px";


        document.body.appendChild(sparkle);



        setTimeout(()=>{

            sparkle.remove();

        },900);


    }


}





function showNewOCText(){


    let text =
    document.getElementById("newOC");


    text.classList.remove("showNew");


    void text.offsetWidth;


    text.classList.add("showNew");


}





function pickOC(){


    if(images.length===0){

        return;

    }



    let randomImage =

    images[
        Math.floor(
            Math.random()*images.length
        )
    ];



    let img =
    document.getElementById("ocImage");



    img.style.opacity=0;



    setTimeout(()=>{


        img.src =

        "https://raw.githubusercontent.com/Peachiepeeps/oc-images/main/"
        +
        randomImage;



        img.onload = ()=>{

            img.style.opacity=1;

        };


    },200);



    createSparkles();


    showNewOCText();


}



</script>


</body>

</html>
