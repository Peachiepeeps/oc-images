<!DOCTYPE html>
<html>
<head>
<title>Random OC Picker</title>

<head>
    <title>My OC Randomizer</title>

    <style>
    body {
        background-image: url("background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        margin: 0;
        min-height: 100vh;
        font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    }

    button:active {
        animation: sparkle 0.4s;
    }

    @keyframes sparkle {
        0% {
            transform: scale(1);
            box-shadow: 0 0 0 pink;
        }

        50% {
            transform: scale(1.15);
            box-shadow: 0 0 20px #ffb6e6;
        }

        100% {
            transform: scale(1);
            box-shadow: 0 0 0 pink;
        }
    }
    </style>
</head>
    
<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #fff5fb;
}

h1 {
    color: #d66aa5;
}

img {
    max-width: 80%;
    max-height: 600px;
    border-radius: 15px;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}
</style>

</head>

<body>

<h1>🌸 Random OC Picker 🌸</h1>

<img id="ocImage" src="" alt="Random OC">

<br>

<img 
src="https://raw.githubusercontent.com/Peachiepeeps/oc-images/main/button.png"
onclick="pickOC()"
style="cursor:pointer; width:200px;"
>


<script>

let images = [];

fetch("https://api.github.com/repos/Peachiepeeps/oc-images/contents?ref=main")
.then(response => response.json())
.then(files => {

images = files
    .filter(file => file.name.match(/\.(png|jpg|jpeg|webp)$/i))
    .map(file => file.name);

    pickOC();

});


function pickOC() {

    let randomImage =
        images[Math.floor(Math.random() * images.length)];

    document.getElementById("ocImage").src = randomImage;

}


function pickOC() {

    let randomImage =
        images[Math.floor(Math.random() * images.length)];

document.getElementById("ocImage").src =
        "https://raw.githubusercontent.com/Peachiepeeps/oc-images/main/" + randomImage;

}

</script>

</body>
</html>
